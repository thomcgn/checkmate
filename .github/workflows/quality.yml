name: Checkmate Quality Gates
on:
  pull_request:
  push:
    branches: [main]
jobs:
  verify:
    name: TypeScript, tests and build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run check
  browser:
    name: Interactive UI smoke (Chromium · 1024×650)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui

  docs-integration:
    name: Full official documentation import (${{ matrix.pack }})
    strategy:
      fail-fast: false
      matrix:
        pack: [rust-book, cpp-reference, php-manual, php-offline-de]
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Import and verify full upstream documentation
        run: node --experimental-strip-types --test tests/documentation-integration.test.ts
        env:
          CHECKMATE_DOCS_INTEGRATION: '1'
          CHECKMATE_DOCS_PACK: ${{ matrix.pack }}
