<!doctype html>
<html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self' data:; style-src 'unsafe-inline'">
<title>CHECKMATE · Start</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}
body{margin:0;background:#10091d;color:#f4e8fc;font-family:system-ui,Arial,sans-serif;overflow:hidden}
.splash{height:100dvh;display:flex;flex-direction:column;position:relative;isolation:isolate;background:radial-gradient(circle at 50% 35%,#37204b 0%,#10091d 70%)}
.splash img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;object-position:center;image-rendering:pixelated;z-index:-1}
.status{margin-top:auto;padding:9px 20px;background:linear-gradient(0deg,rgba(13,8,23,.98),rgba(13,8,23,.82));display:flex;align-items:center;gap:9px;font:600 12px/1.5 system-ui,Arial,sans-serif;letter-spacing:.06em}
.pulse{width:7px;height:7px;border-radius:50%;background:#43e5ef;box-shadow:0 0 14px #43e5ef;animation:pulse 1.1s ease-in-out infinite alternate}
.status span:last-child{margin-left:auto;color:#f9c675;font-size:10px}
@keyframes pulse{from{opacity:.3}to{opacity:1}}
@media(prefers-reduced-motion:reduce){.pulse{animation:none}}
</style></head>
<body><main class="splash"><img src="./assets/checkmate-splash.svg" alt="Checkmate, learn the logic – Pixel-Art-Bibliothek mit Schachkönig" draggable="false"><div class="status" role="status" aria-live="polite"><span class="pulse" aria-hidden="true"></span>CHECKMATE wird gestartet <span>LEARN THE LOGIC</span></div></main></body></html>
